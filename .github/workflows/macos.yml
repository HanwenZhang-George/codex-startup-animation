name: macOS build and offline tests

on:
  pull_request:
    paths:
      - 'macos/**'
      - 'community-v34/renderer.js'
      - 'community-v34/media-manifest.json'
      - 'community-v34/tests/**'
      - '.github/workflows/macos.yml'
  push:
    paths:
      - 'macos/**'
      - 'community-v34/renderer.js'
      - 'community-v34/media-manifest.json'
      - 'community-v34/tests/**'
      - '.github/workflows/macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: macos/package-lock.json
      - name: Install test dependencies
        working-directory: macos
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build universal launcher and verify original media
        run: ./macos/scripts/build.sh
      - name: Verify native bundle and decode an original video frame
        run: ./macos/scripts/test.sh --offline
      - name: Test legacy and modern renderer layouts with original videos
        run: ./macos/scripts/test-renderer.sh
      - name: Verify Dock binding and restore in an isolated preferences domain
        run: python3 macos/tests/dock-binding.py
